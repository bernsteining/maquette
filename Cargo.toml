[workspace]
# Virtual workspace hosting all four plugins:
#   * maquette        — STL/OBJ/PLY plugin (root of the family, historical).
#   * maquette-core   — render primitives shared by every plugin (math, colour,
#                       rasterizer, SSAA/SSAO/FXAA, shadow maps, IBL env, HDR
#                       + texture decode). Format-agnostic.
#   * maquette-gltf   — glTF 2.0 asset renderer. Depends on maquette-core +
#                       gltf-rs + meshopt-rs.
#   * maquette-scad   — OpenSCAD-flavored procedural geometry compiled via
#                       the Manifold CSG kernel; returns PLY bytes consumed
#                       by maquette's render-ply.
#
# `maquette` is not yet migrated onto maquette-core (its rasterizer/shader
# have their own set of features and the merge needs a visual-regression pass).
resolver = "2"
members = ["crates/maquette", "crates/maquette-core", "crates/maquette-gltf", "crates/maquette-scad"]
exclude = ["crates/vendored"]

# Local fork of manifold-csg-sys with MANIFOLD_WASM_CXX_FLAGS env-var
# passthrough patched into build/wasm.rs. Delta vs 3.5.104 = one env
# read + splicing that into the two cmake configures (shim + manifold)
# and the libcxx-extras clang++ invocation. Enables benchmarking
# -O3/-msimd128/-flto without waiting on an upstream release.
[patch.crates-io]
manifold-csg-sys = { path = "crates/vendored/manifold-csg-sys" }

# Applied to every workspace member unless overridden — matches what the
# wasm plugins need (fat LTO, strip, opt=3, no panic).
[profile.release]
lto = "fat"
strip = true
opt-level = 3
codegen-units = 1
panic = 'abort'
debug = false
debug-assertions = false
overflow-checks = false

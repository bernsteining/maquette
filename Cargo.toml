[workspace]
# Virtual workspace hosting all four plugins:
#   * maquette        — STL/OBJ/PLY plugin (root of the family, historical).
#   * maquette-core   — render primitives shared by every plugin (math, colour,
#                       rasterizer, SSAA/SSAO/FXAA, shadow maps, IBL env, HDR
#                       + texture decode). Format-agnostic.
#   * maquette-gltf   — glTF 2.0 asset renderer. Depends on maquette-core +
#                       gltf-rs + meshopt-rs.
#   * maquette-scad   — OpenSCAD-flavored procedural geometry compiled via
#                       the Manifold CSG kernel; returns PLY bytes consumed
#                       by maquette's render-ply.
#
# `maquette` is not yet migrated onto maquette-core (its rasterizer/shader
# have their own set of features and the merge needs a visual-regression pass).
resolver = "2"
members = ["crates/maquette", "crates/maquette-core", "crates/maquette-gltf", "crates/maquette-scad", "crates/maquette-cli"]
exclude = ["crates/vendored"]

# Local fork of manifold-csg-sys with MANIFOLD_WASM_CXX_FLAGS env-var
# passthrough patched into build/wasm.rs. Delta vs 3.5.104 = one env
# read + splicing that into the two cmake configures (shim + manifold)
# and the libcxx-extras clang++ invocation. Enables benchmarking
# -O3/-msimd128/-flto without waiting on an upstream release.
[patch.crates-io]
manifold-csg-sys = { path = "crates/vendored/manifold-csg-sys" }

# Applied to every workspace member unless overridden — matches what the
# wasm plugins need (fat LTO, strip, opt=3, no panic).
[profile.release]
lto = "fat"
strip = true
opt-level = 3
codegen-units = 1
panic = 'abort'
debug = false
debug-assertions = false
overflow-checks = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# clippy runs with -D warnings (see `make lint`). The lints below are the
# renderer's deliberate style — many-argument shader/setup fns, index loops in
# hot paths, compact doc formatting — allowed so the gate catches real defects
# (correctness lints stay denied) rather than churning hand-tuned code. Trim
# this list to progressively tighten.
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_borrow = "allow"
needless_range_loop = "allow"
empty_line_after_doc_comments = "allow"
doc_lazy_continuation = "allow"
type_complexity = "allow"
unnecessary_map_or = "allow"
manual_clamp = "allow"
should_implement_trait = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
needless_lifetimes = "allow"
ptr_arg = "allow"
get_first = "allow"
derivable_impls = "allow"
unnecessary_cast = "allow"
manual_range_contains = "allow"
large_enum_variant = "allow"
implicit_saturating_sub = "allow"
for_kv_map = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
identity_op = "allow"
disallowed_names = "allow"
bind_instead_of_map = "allow"
unnecessary_first_then_check = "allow"
single_match = "allow"
manual_contains = "allow"
field_reassign_with_default = "allow"
wrong_self_convention = "allow"

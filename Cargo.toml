[workspace]
# Root workspace hosts the existing `maquette` crate (STL/OBJ/PLY plugin) plus
# two new crates:
#   * maquette-core  — render primitives shared by every plugin: math, colour,
#                      rasterizer, SSAA/SSAO/FXAA, shadow maps, IBL env, HDR
#                      + texture decode. Format-agnostic.
#   * maquette-gltf  — a second Typst plugin that renders glTF 2.0 assets.
#                      Depends on maquette-core for the render primitives and
#                      on gltf-rs (+ meshopt-rs) for asset parsing.
#
# The root package is still the existing `maquette` (STL/OBJ/PLY) plugin — its
# `src/` is untouched by this refactor. Migration of `maquette` onto
# maquette-core is deferred to a follow-up (its rasterizer/shader have their
# own set of features and the merge needs its own visual-regression pass).
resolver = "2"
members = ["crates/maquette-core", "crates/maquette-gltf", "crates/maquette-scad"]
exclude = ["crates/vendored"]

# Local fork of manifold-csg-sys with MANIFOLD_WASM_CXX_FLAGS env-var
# passthrough patched into build/wasm.rs. Delta vs 3.5.104 = one env
# read + splicing that into the two cmake configures (shim + manifold)
# and the libcxx-extras clang++ invocation. Enables benchmarking
# -O3/-msimd128/-flto without waiting on an upstream release.
[patch.crates-io]
manifold-csg-sys = { path = "crates/vendored/manifold-csg-sys" }

[package]
name = "maquette"
version = "0.1.3"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-minimal-protocol = { git = "https://github.com/astrale-sharp/wasm-minimal-protocol" }

# `release` on the workspace root applies to every workspace member unless
# they override it — matches what maquette-gltf needs (fat LTO, no panic).
[profile.release]
lto = "fat"
strip = true
opt-level = 3
codegen-units = 1
panic = 'abort'
debug = false
debug-assertions = false
overflow-checks = false

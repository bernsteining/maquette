[package]
name = "maquette"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-minimal-protocol = { git = "https://github.com/astrale-sharp/wasm-minimal-protocol" }

# Only the native build (CLI PNG file export) compresses PNGs with miniz; the
# wasm plugin emits raw RGBA and uses stored-deflate for its rare SVG-embedded
# rasters, so it needs no compressor.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
miniz_oxide = "0.9.1"

[profile.release]
lto = "fat"
strip = true
opt-level = 3
codegen-units = 1
panic = 'abort'
debug = false
debug-assertions = false
overflow-checks = false

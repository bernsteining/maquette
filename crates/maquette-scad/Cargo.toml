[package]
name = "maquette-scad"
version = "0.1.0"
edition = "2021"
description = "OpenSCAD-flavored procedural geometry -> PLY, as a Typst wasm plugin, for maquette."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]  # rlib so a native repro harness can link it

[dependencies]
wasm-minimal-protocol = { git = "https://github.com/astrale-sharp/wasm-minimal-protocol" }
# Real .scad text ingestion: parser only (we write the evaluator in src/scad.rs).
openscad-rs = "0.1.0"
rpds = "1"
rustc-hash = "2"   # fast non-cryptographic hasher (FxHashMap) for internal maps
archery = "1"       # name RcK to give rpds's HashTrieMap the Fx hasher
# Parses TTF/OTF outlines for OpenSCAD `text()`. Pure-Rust, wasm-clean,
# no_std-friendly. We ship a subset DejaVu Sans (assets/) as the default
# font; users can pass their own via `scadypst(font: read("...", none))`.
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }

# CSG kernel = Manifold (elalish/manifold) via safe Rust bindings over its C API.
# Manifold GUARANTEES watertight, correctly-triangulated boolean output — unlike
# csgrs 0.20.1, whose BSP union/difference leave ~20% of faces open on any
# non-trivial face split (bores/notches/partial overlaps). See FIDELITY.md.
#
# Features differ by target:
#  - wasm32: `unstable-wasm-uu` links the C++ runtime IN via wasm-cxx-shim (built
#    -fno-exceptions), so the module is self-contained (0 host imports) and runs
#    under Typst's wasmi. OBJ I/O is disabled on this target.
#  - native (repro/probe harnesses): default serial build, system clang/cmake.
[target.'cfg(target_arch = "wasm32")'.dependencies]
manifold-csg = { version = "0.4", default-features = false, features = ["unstable-wasm-uu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
manifold-csg = { version = "0.4", default-features = false }

# `[profile.release]` deliberately omitted: this crate is a workspace member
# now (see the root Cargo.toml). Cargo ignores per-member profile blocks and
# emits a warning if one is present. The root's release profile (fat LTO,
# strip, opt-level=3, no panic) already matches what we'd want here.

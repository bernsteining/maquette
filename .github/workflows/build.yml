name: Build plugins

# Validates the plugins compile from source and (on a v* tag) publishes the
# wasms as release assets. Master pushes are handled by the pages workflow,
# which is the single build+deploy pipeline for the demo — so this no longer
# runs on master, and the two workflows never double-build the same wasm.
#
# On a pull request only the plugins whose sources (or the shared core/build
# inputs) changed are built. Tags and manual runs build all three.
#
# Runs inside the prebuilt ghcr toolchain image (see .github/docker/Dockerfile
# + ci-image.yml): cmake/clang/libc++, emsdk and binaryen are baked in.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core: &core
              - 'crates/maquette-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'Makefile'
              - 'harness/**'
              - '.github/workflows/build.yml'
            maquette:
              - *core
              - 'crates/maquette/**'
            gltf:
              - *core
              - 'crates/maquette-gltf/**'
            scad:
              - *core
              - 'crates/maquette-scad/**'
      - id: set
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          M: ${{ steps.filter.outputs.maquette }}
          G: ${{ steps.filter.outputs.gltf }}
          S: ${{ steps.filter.outputs.scad }}
        run: |
          all=false
          case "$REF" in refs/tags/*) all=true ;; esac
          [ "$EVENT" = "workflow_dispatch" ] && all=true
          inc=()
          add() { inc+=("{\"name\":\"$1\",\"make_target\":\"$2\",\"wasm_path\":\"$3\"}"); }
          { [ "$all" = true ] || [ "$M" = true ]; } && add maquette      wasm      crates/maquette/maquette.wasm
          { [ "$all" = true ] || [ "$G" = true ]; } && add maquette-gltf gltf-wasm crates/maquette-gltf/maquette-gltf.wasm
          { [ "$all" = true ] || [ "$S" = true ]; } && add maquette-scad scad-wasm crates/maquette-scad/maquette-scad.wasm
          json=$(printf '%s\n' "${inc[@]}" | paste -sd, -)
          echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"
          if [ ${#inc[@]} -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "building: ${inc[*]:-none}"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Cargo & C++ build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          workspaces: |
            . -> target
            harness -> target

      - name: Build (Makefile — single source of truth for flags)
        shell: bash
        run: |
          export EMSDK="${EMSDK:-/opt/emsdk}"
          make ${{ matrix.make_target }} REMAP="--remap-path-prefix=$PWD=. --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$RUSTUP_HOME=/rustup --remap-path-prefix=$HOME=~"

      - name: Verify no build paths leaked into wasm
        run: |
          if grep -aE '/(home|root|Users)/[A-Za-z0-9._-]' ${{ matrix.wasm_path }}; then
            echo "::error::build path leaked into ${{ matrix.wasm_path }}"
            exit 1
          fi
          echo "no path leaks ✓"

      - name: Wasm invariants (protocol-only imports + size budget)
        run: .github/scripts/wasm-invariants.sh ${{ matrix.wasm_path }}

      - name: Build harness (for functional drift check)
        run: cargo build --release --manifest-path harness/Cargo.toml

      - name: Functional drift check vs committed copy
        shell: bash
        env:
          PLUGIN: ${{ matrix.name }}
          WASM: ${{ matrix.wasm_path }}
        run: |
          committed="docs/$(basename "$WASM")"
          if [ ! -f "$committed" ]; then
            echo "no committed copy at $committed — skipping drift check"
            exit 0
          fi
          case "$PLUGIN" in
            maquette)
              cfg=$(mktemp); echo '{"width":128,"height":128,"azimuth":0,"elevation":0,"background":"#f0f0f0","antialias":1}' > "$cfg"
              args=(render_obj_png examples/data/teapot.obj "$cfg")
              ;;
            maquette-gltf)
              cfg=$(mktemp); echo '{"width":128,"height":128,"camera":[2.5,1.5,2.5],"center":[0,0,0],"up":[0,1,0],"fov":40,"background":"#181820"}' > "$cfg"
              args=(render_gltf examples/data/gltf/helmet.blg "$cfg")
              ;;
            maquette-scad)
              cfg=$(mktemp); echo '{"fn":32}' > "$cfg"
              params=$(mktemp); echo '{}' > "$params"
              extras=$(mktemp); : > "$extras"
              args=(build_scad examples/scad/data/nut.scad "$cfg" "$params" "$extras")
              ;;
          esac
          ci_out=$(mktemp); co_out=$(mktemp)
          harness/target/release/harness "$WASM"      "${args[@]}" > "$ci_out"
          harness/target/release/harness "$committed" "${args[@]}" > "$co_out"
          ci_sha=$(sha1sum "$ci_out" | cut -c1-12)
          co_sha=$(sha1sum "$co_out" | cut -c1-12)
          if [ "$ci_sha" = "$co_sha" ]; then
            echo "output sha match ($ci_sha) — functionally equivalent ✓"
          else
            echo "::error::functional drift: CI wasm output sha=$ci_sha vs committed output sha=$co_sha"
            exit 1
          fi

      - name: Report size + sha
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la ${{ matrix.wasm_path }} >> $GITHUB_STEP_SUMMARY
          sha1sum ${{ matrix.wasm_path }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-wasm
          path: ${{ matrix.wasm_path }}
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage flat wasm layout for release assets
        run: |
          mkdir -p release
          find artifacts -name '*.wasm' -exec cp {} release/ \;
          ls -la release/
          (cd release && sha256sum *.wasm > wasm.sha256.sum)

      - name: Attach wasm to the dist-created GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dist's Release workflow owns the GitHub Release for this tag (CLI
          # binaries + installers). Wait for it, then attach the plugin wasm.
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" release/*.wasm release/wasm.sha256.sum --clobber --repo "$GITHUB_REPOSITORY"
              echo "attached wasm to release $GITHUB_REF_NAME"
              exit 0
            fi
            echo "waiting for dist release $GITHUB_REF_NAME to exist ($i/60)…"
            sleep 15
          done
          echo "::error::dist release $GITHUB_REF_NAME never appeared"
          exit 1

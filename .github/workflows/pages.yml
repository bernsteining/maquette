name: Deploy demo (GitHub Pages)

# The single build + deploy pipeline for master. It rebuilds only the plugin
# wasms whose sources (or the shared core/build inputs) changed on this push,
# and reuses the last-deployed wasm from the live site for the rest — so an
# unchanged plugin is never recompiled, and a core change rebuilds all three.
# docs/ is then deployed to Pages, keeping the live demo in sync with source.
#
# Runs inside the prebuilt ghcr toolchain image (see .github/docker/Dockerfile
# + ci-image.yml): cmake/clang/libc++, emsdk and binaryen are baked in.

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "docs/**"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  # Never cancel a deploy in flight: each run reuses the live site as the
  # baseline for unchanged plugins, so runs must complete in order for the
  # demo to always end on the latest pushed wasm.
  cancel-in-progress: false

env:
  LIVE_BASE: https://bernsteining.github.io/maquette

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      maquette: ${{ steps.filter.outputs.maquette }}
      gltf: ${{ steps.filter.outputs.gltf }}
      scad: ${{ steps.filter.outputs.scad }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: &core
              - 'crates/maquette-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'Makefile'
              - '.github/workflows/pages.yml'
            maquette:
              - *core
              - 'crates/maquette/**'
            gltf:
              - *core
              - 'crates/maquette-gltf/**'
            scad:
              - *core
              - 'crates/maquette-scad/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BUILD_MAQUETTE: ${{ needs.changes.outputs.maquette }}
      BUILD_GLTF: ${{ needs.changes.outputs.gltf }}
      BUILD_SCAD: ${{ needs.changes.outputs.scad }}
    steps:
      - uses: actions/checkout@v7

      - name: Cargo & C++ build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      - name: Build changed wasms; reuse last-deployed for the rest
        shell: bash
        run: |
          export EMSDK="${EMSDK:-/opt/emsdk}"
          REMAP="--remap-path-prefix=$PWD=. --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$RUSTUP_HOME=/rustup --remap-path-prefix=$HOME=~"
          # $1 changed-flag  $2 make-target  $3 built-path  $4 dst-name
          resolve() {
            if [ "$1" = "true" ]; then
              echo "build $4 (changed)"
              make "$2" REMAP="$REMAP"
              cp "$3" "docs/$4"
            elif curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$LIVE_BASE/$4" -o "docs/$4" && [ -s "docs/$4" ]; then
              echo "reuse $4 from live deploy"
            else
              echo "$4 not on live site — building"
              make "$2" REMAP="$REMAP"
              cp "$3" "docs/$4"
            fi
          }
          resolve "$BUILD_MAQUETTE" wasm      crates/maquette/maquette.wasm            maquette.wasm
          resolve "$BUILD_GLTF"     gltf-wasm crates/maquette-gltf/maquette-gltf.wasm  maquette-gltf.wasm
          resolve "$BUILD_SCAD"     scad-wasm crates/maquette-scad/maquette-scad.wasm  maquette-scad.wasm
          for w in maquette maquette-gltf maquette-scad; do
            [ -s "docs/$w.wasm" ] || { echo "::error::missing docs/$w.wasm"; exit 1; }
          done
          ls -la docs/*.wasm

      - name: Verify no build paths leaked into freshly built wasm
        shell: bash
        run: |
          leak() { if grep -aE '/(home|root|Users)/[A-Za-z0-9._-]' "$1"; then echo "::error::build path leaked into $1"; exit 1; fi; }
          if [ "$BUILD_MAQUETTE" = "true" ]; then leak docs/maquette.wasm; fi
          if [ "$BUILD_GLTF" = "true" ]; then leak docs/maquette-gltf.wasm; fi
          if [ "$BUILD_SCAD" = "true" ]; then leak docs/maquette-scad.wasm; fi
          echo "path-leak check done ✓"

      - name: Wasm invariants (protocol-only imports + size budget)
        run: |
          for w in maquette maquette-gltf maquette-scad; do
            .github/scripts/wasm-invariants.sh "docs/$w.wasm"
          done

      - name: Stage demo assets + stamp build commit
        shell: bash
        run: |
          make demo-assets
          ls -la docs/*.obj docs/*.ply
          sed -i "s/__BUILD_COMMIT__/${GITHUB_SHA::7}/g" docs/index.html
          echo "stamped build ${GITHUB_SHA::7}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint demo JS (module-graph no-undef)
        run: make lint-js

      - name: Bundle + minify demo JS
        shell: bash
        run: |
          # Bundle the ES modules (docs/js/*) into one minified file for the
          # deployed site. Source modules stay in the artifact for debugging;
          # index.html is pointed at the bundle. esbuild resolves every import,
          # so a broken module graph fails the build here.
          npx --yes esbuild@0.24.0 docs/js/main.js \
            --bundle --minify --format=esm --legal-comments=none \
            --outfile=docs/js/app.bundle.js
          # Smoke-test the bundle: evaluate the whole graph + boot() under a
          # stubbed DOM to catch import/TDZ/reference errors (browser behavior
          # still needs a manual pass).
          cp docs/js/app.bundle.js /tmp/app.bundle.mjs
          node .github/scripts/webdemo-smoke.mjs /tmp/app.bundle.mjs
          # Point the page (script + modulepreload) at the bundle, cache-busted
          # by the build SHA.
          sed -i "s|js/main.js?v=[0-9]*|js/app.bundle.js?v=${GITHUB_SHA::7}|g" docs/index.html
          grep -q "js/app.bundle.js" docs/index.html && echo "index.html → bundle ✓"
          ls -la docs/js/app.bundle.js

      - name: Minify index.html (+ inline CSS)
        shell: bash
        run: |
          npx --yes html-minifier-terser@7.2.0 \
            --collapse-whitespace --remove-comments --minify-css true \
            docs/index.html -o docs/index.min.html
          mv docs/index.min.html docs/index.html
          echo "minified index.html → $(wc -c < docs/index.html) bytes"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: Python wheels

# Builds abi3 wheels + sdist for the maquette Python bindings (crates/maquette-py)
# on Linux/macOS/Windows. Publishing to PyPI is gated and OPT-IN: it only runs on
# a v* tag AND only once PyPI Trusted Publishing is configured for this project
# (https://docs.pypi.org/trusted-publishers/). Until then this just produces
# downloadable wheel artifacts. Nothing is published automatically.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  MATURIN_DIR: crates/maquette-py

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          command: build
          args: --release --out dist
          manylinux: auto
          # Manifold's CSG kernel is built from source with cmake inside the
          # manylinux container (system g++ is present).
          before-script-linux: |
            if command -v dnf >/dev/null; then dnf install -y cmake
            elif command -v yum >/dev/null; then yum install -y cmake
            elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y cmake
            fi
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: ${{ env.MATURIN_DIR }}/dist

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7
      - run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          command: build
          args: --release --out dist --target ${{ matrix.target }}-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: ${{ env.MATURIN_DIR }}/dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows
          path: ${{ env.MATURIN_DIR }}/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.MATURIN_DIR }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: ${{ env.MATURIN_DIR }}/dist

  # OPT-IN publish: only on a v* tag, and only works once a PyPI project +
  # Trusted Publisher (this repo/workflow) exist. Safe to leave in place — it
  # no-ops on non-tag runs.
  publish:
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
